services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the Portainer stack environment}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the Portainer stack environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the Portainer stack environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai
    networks:
      - internal
    expose:
      - "8000"
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      DATABASE_SSL: "false"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in the Portainer stack environment}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in the Portainer stack environment}
      AI_SERVICE_URL: http://ai-service:8000
      CLIENT_ORIGIN: ${PUBLIC_URL:?Set PUBLIC_URL in the Portainer stack environment}
      PORT: "5000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - internal
    restart: "no"
    command: ["npm", "run", "migrate"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      DATABASE_SSL: "false"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in the Portainer stack environment}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in the Portainer stack environment}
      AI_SERVICE_URL: http://ai-service:8000
      CLIENT_ORIGIN: ${PUBLIC_URL:?Set PUBLIC_URL in the Portainer stack environment}
      PORT: "5000"
    depends_on:
      database:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    expose:
      - "5000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: /
    depends_on:
      backend:
        condition: service_started
    networks:
      - internal
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge

<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Absensi AI</title>
    <style>
      body {
        font-family: sans-serif;
        background-color: #f4f4f9;
        padding: 20px;
        margin: 0;
      }
      .container {
        max-width: 800px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      button {
        padding: 10px 15px;
        cursor: pointer;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        font-weight: bold;
      }
      button:active {
        transform: scale(0.95);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #ddd;
      }
      th {
        background-color: #343a40;
        color: white;
      }
      tr:hover {
        background-color: #f1f1f1;
      }
      .sukses {
        color: green;
        font-weight: bold;
      }
      .gagal {
        color: red;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h2>Log Aktivitas Karyawan</h2>
        <button onclick="fetchLogs()">🔄 Refresh Data</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Waktu (Tanggal & Jam)</th>
            <th>Nama</th>
            <th>Aktivitas</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tabel-log">
          <tr>
            <td colspan="4" style="text-align: center">Memuat data...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <script>
      async function fetchLogs() {
        const tbody = document.getElementById("tabel-log");
        try {
          // Mengambil data dari endpoint Express
          const response = await fetch("http://localhost:5000/api/logs");
          const logs = await response.json();

          tbody.innerHTML = "";

          if (logs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Belum ada aktivitas terekam.</td></tr>';
            return;
          }

          // Membalik urutan agar log terbaru muncul paling atas
          logs.reverse().forEach((log) => {
            const statusClass = log.status === "Sukses" ? "sukses" : "gagal";
            tbody.innerHTML += `
                        <tr>
                            <td>${log.waktu}</td>
                            <td><strong>${log.nama}</strong></td>
                            <td>${log.aktivitas}</td>
                            <td class="${statusClass}">${log.status}</td>
                        </tr>
                    `;
          });
        } catch (err) {
          tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">Koneksi ke backend terputus.</td></tr>';
        }
      }

      // Jalankan fetchLogs otomatis saat halaman pertama kali dibuka
      fetchLogs();
    </script>
  </body>
</html>
